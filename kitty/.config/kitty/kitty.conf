include gruvbox.conf

font_size        12.0
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

window_padding_width    4 12
hide_window_decorations yes

tab_bar_edge    top
tab_bar_style   powerline

map ctrl+shift+t new_tab_with_cwd
