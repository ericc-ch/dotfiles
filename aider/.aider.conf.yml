# Reference
# https://aider.chat/docs/config/aider_conf.html#sample-yaml-config-file

## Specify the model to use for the main chat

model: openai/gemini-2.5-pro
# model: openai/gemini-2.5-flash
# model: openai/claude-3.7-sonnet-thought
# model: openai/claude-3.7-sonnet
# model: openai/claude-3.5-sonnet
# model: openai/gpt-4o
# model: openai/o1
# model: openai/o3-mini

########################
## API Keys and settings:

## Specify the OpenAI API key
openai-api-key: not-needed

## Specify the api base url
# openai-api-base: http://localhost:4141/
openai-api-base: http://localhost:4157

#################
## Model settings:

## Add a model alias (can be used multiple times)
alias:
  - "sonnet:openai/claude-3.7-sonnet"
  - "sonnet-thinking:openai/claude-3.7-sonnet-thought"
  - "gemini-flash:gemini/gemini-2.5-flash"

## Specify the model to use for commit messages and chat history summarization (default depends on --model)
weak-model: gemini/gemini-2.5-flash
# weak-model: gemini/gemini-2.0-flash

## Only work with models that have meta-data available (default: True)
show-model-warnings: true

##################
# Output settings:

## Use colors suitable for a dark terminal background (default: False)
dark-mode: true

###############
# Git settings:

## Enable/disable auto commit of LLM changes (default: True)
auto-commits: false

## Enable/disable commits when repo is found dirty (default: True)
dirty-commits: false

## Attribute aider code changes in the git author name (default: True)
attribute-author: false

## Attribute aider commits in the git committer name (default: True)
attribute-committer: false

#################
# Other settings:

## Specify read-only files
# read:
# - "~/conventions/general.md"
# - "~/conventions/typescript.md"
# - "~/conventions/ghostty-shader.md"

## Enable/disable detection and offering to add URLs to chat (default: True)
detect-urls: false

## Always say yes to every confirmation
yes-always: false
