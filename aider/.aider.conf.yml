# Reference
# https://aider.chat/docs/config/aider_conf.html#sample-yaml-config-file

## Specify the model to use for the main chat

# model: codestral/codestral-latest
# model: openrouter/deepseek/deepseek-r1
# model: gemini/gemini-2.0-flash-thinking-exp
# model: openai/claude-3.7-sonnet-thought
model: openai/claude-3.7-sonnet
# model: openai/claude-3.5-sonnet
# model: openai/gpt-4o
# model: openai/o1
# model: openai/o3-mini

########################
## API Keys and settings:

## Specify the OpenAI API key
openai-api-key: not-needed

## Specify the api base url
openai-api-base: http://localhost:4141/
# openai-api-base: http://localhost:4460/

#################
## Model settings:

## Add a model alias (can be used multiple times)
alias:
  - "sonnet-3.5:openai/claude-3.5-sonnet"
  - "sonnet:openai/claude-3.7-sonnet"
  - "sonnet-t:openai/claude-3.7-sonnet-thought"
  - "copilot-flash:openai/gemini-2.0-flash-001"
  - "r1:openrouter/deepseek/deepseek-r1"
  - "duck-haiku:openai/claude-3-haiku"
  - "codestral:codestral/codestral-latest"
  - "flash:gemini/gemini-2.0-flash"
  - "flash-t:gemini/gemini-2.0-flash-thinking-exp"
  - "o3:openai/o3-mini"

## Specify a file with aider model settings for unknown models
model-settings-file: ~/.config/aider/.aider.model.settings.yml

## Specify a file with context window and costs for unknown models
model-metadata-file: ~/.config/aider/.aider.model.metadata.json

## Specify the model to use for commit messages and chat history summarization (default depends on --model)
# weak-model: openai/gemini-2.0-flash-001
# weak-model: openai/gpt-4o-mini
# weak-model: openai/gpt-4o
# weak-model: mistral/mistral-large-latest
# weak-model: mistral/open-mistral-nemo
# weak-model: gemini/gemini-2.0-flash

## Specify the model to use for editor tasks (default depends on --model)
# editor-model: openai/claude-3.7-sonnet-thought
# editor-model: openai/claude-3.7-sonnet
# editor-model: openai/claude-3.5-sonnet
# editor-model: gemini/gemini-2.0-flash

## Only work with models that have meta-data available (default: True)
show-model-warnings: true

###################
# Repomap settings:

## Suggested number of tokens to use for repo map, use 0 to disable (default: 1024)
map-tokens: 1024

##################
# Output settings:

## Use colors suitable for a dark terminal background (default: False)
dark-mode: true

###############
# Git settings:

## Enable/disable auto commit of LLM changes (default: True)
auto-commits: false

## Enable/disable commits when repo is found dirty (default: True)
dirty-commits: false

## Attribute aider code changes in the git author name (default: True)
attribute-author: false

## Attribute aider commits in the git committer name (default: True)
attribute-committer: false

#################
# Other settings:

## Specify read-only files
read:
  - "~/conventions/general.md"
  - "~/conventions/typescript.md"
  # - "~/conventions/python.md"
  # - "~/conventions/go.md"
  # - "~/conventions/ghostty-shader.md"

## Enable/disable detection and offering to add URLs to chat (default: True)
detect-urls: false

## Always say yes to every confirmation
yes-always: false
